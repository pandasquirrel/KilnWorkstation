name: vendor-ci

# Gate for absorb PRs: type system catches most upstream refactors, changed
# tests cover behavior. Full suite runs on main after each absorb.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/vendor/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vendor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No version input: package.json "packageManager" pins pnpm (with hash).
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc
      - run: pnpm run check:code-quality:changed
      - name: Changed-area tests
        run: |
          BASE=$(git merge-base origin/main HEAD)
          DIRS=$(git diff --name-only "$BASE" HEAD | grep -P '\.test\.ts$' |
            xargs -r -n1 dirname | sort -u | head -30 | tr '\n' ' ')
          if [ -n "$DIRS" ]; then pnpm test $DIRS; else echo "no test files in diff"; fi

  # Upstream topology (config/scripts/ci-unit-files.mjs UNIT_EXCLUDE): root
  # unit shards exclude cross-version-wire (materializes full release trees),
  # live-PTY probes (custom runners), and electron probes (package job).
  full-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /usr/share/dotnet /usr/local/share/boost /opt/microsoft 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: node config/scripts/ensure-native-runtime.mjs --runtime=node
      - name: Unit shard ${{ matrix.shard }}/4
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
        run: >
          node config/scripts/run-vitest.mjs run
          --config scripts/vendor/vitest-fork-unit.config.ts
          --shard=${{ matrix.shard }}/4

  # Separate lane: these tests resolve released tags and materialize release
  # checkouts, so they get their own runners and upstream refs.
  cross-version-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /usr/share/dotnet /usr/local/share/boost /opt/microsoft 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Fetch upstream release refs
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream --tags --prune \
            "+refs/heads/main:refs/remotes/upstream/main"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: node config/scripts/ensure-native-runtime.mjs --runtime=node
      - name: Cross-version shard ${{ matrix.shard }}/2
        run: >
          node config/scripts/run-vitest.mjs run
          --config config/vitest.config.ts
          tests/e2e/cross-version-wire
          --shard=${{ matrix.shard }}/2
