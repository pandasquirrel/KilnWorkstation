name: vendor-ci

# Gate for absorb PRs: type system catches most upstream refactors, changed
# tests cover behavior. Full suite runs on main after each absorb.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/vendor/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vendor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No version input: package.json "packageManager" pins pnpm (with hash).
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc
      - run: pnpm run check:code-quality:changed
      - name: Changed-area tests
        run: |
          BASE=$(git merge-base origin/main HEAD)
          DIRS=$(git diff --name-only "$BASE" HEAD | grep -P '\.test\.ts$' |
            xargs -r -n1 dirname | sort -u | head -30 | tr '\n' ' ')
          if [ -n "$DIRS" ]; then pnpm test $DIRS; else echo "no test files in diff"; fi

  full-test:
    # Full suite exceeds 90m single-runner; vitest sharding mirrors upstream.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Hosted runners keep ~14GB free; full history + node_modules + the
      # release trees materialized by cross-version tests exhaust it (ENOSPC
      # cascades into store/window.api failures). Drop unused toolchains.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # cross-version-wire tests resolve historical tags/SHAs from the object db.
      - name: Fetch upstream release refs
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream --tags --prune \
            "+refs/heads/main:refs/remotes/upstream/main"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: node config/scripts/ensure-native-runtime.mjs --runtime=node
      - run: node config/scripts/install-electron-package-binary.mjs
      - run: node config/scripts/run-vitest.mjs run --config config/vitest.config.ts --shard=${{ matrix.shard }}/4
