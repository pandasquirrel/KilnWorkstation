name: vendor-ci

# Gate for absorb PRs: type system catches most upstream refactors, changed
# tests cover behavior. Full suite runs on main after each absorb.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/vendor/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vendor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No version input: package.json "packageManager" pins pnpm (with hash).
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc
      - name: Changed code quality
        run: |
          if [ "${{ github.head_ref }}" = "vendor/sync-latest" ]; then
            # FORK: gate only the fork footprint (diff against the mirrored upstream
            # tip), so lint debt inside absorbed upstream commits never blocks the
            # merge. The script hard-bases pull_request at HEAD^1; a step-level env
            # override of GITHUB_EVENT_NAME does not reach the child, so unset it
            # entirely and pin an explicit base (full checkout already has the mirror).
            BASE=$(git merge-base origin/vendor/upstream HEAD)
            echo "absorb footprint base: $BASE"
            env -u GITHUB_EVENT_NAME ORCA_CODE_QUALITY_BASE="$BASE" \
              pnpm run check:code-quality:changed
          else
            pnpm run check:code-quality:changed
          fi
      - name: Changed-area tests
        if: github.event_name != 'pull_request' || github.head_ref != 'vendor/sync-latest'
        run: |
          BASE=$(git merge-base origin/main HEAD)
          DIRS=$(git diff --name-only "$BASE" HEAD | grep -P '\.test\.ts$' |
            xargs -r -n1 dirname | sort -u | head -30 | tr '\n' ' ')
          if [ -n "$DIRS" ]; then pnpm test $DIRS; else echo "no test files in diff"; fi

  # Upstream topology (config/scripts/ci-unit-files.mjs UNIT_EXCLUDE): root
  # unit shards exclude cross-version-wire (materializes full release trees),
  # live-PTY probes (custom runners), and electron probes (package job).
  full-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /usr/share/dotnet /usr/local/share/boost /opt/microsoft 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: node config/scripts/ensure-native-runtime.mjs --runtime=node
      - name: Unit shard ${{ matrix.shard }}/4
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
        run: >
          node config/scripts/run-vitest.mjs run
          --config config/vitest.config.ts
          --shard=${{ matrix.shard }}/4

  # Separate lane: these tests resolve released tags and materialize release
  # checkouts. Upstream runs the whole directory unsharded on one runner.
  cross-version-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # blob:none like upstream pr.yml: commit graph + tags are required, but
      # historical blobs are lazy-fetched on demand (the fork origin holds all
      # objects and acts as the promisor), saving ~89% of the clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /usr/share/dotnet /usr/local/share/boost /opt/microsoft 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: config/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Fetch upstream release refs (commit graph only)
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git -c protocol.version=2 fetch --filter=blob:none upstream \
            --tags --prune "+refs/heads/main:refs/remotes/upstream/main"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: node config/scripts/ensure-native-runtime.mjs --runtime=node
      # Node, not bun: the materialized release sources call stripTypeScriptTypes
      # (node:module), which bun's shim lacks. Mirrors upstream's plain vitest call.
      - name: Old/new client and server compatibility journeys
        run: >
          pnpm exec vitest run
          --config config/vitest.config.ts
          tests/e2e/cross-version-wire/
