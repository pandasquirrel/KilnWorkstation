name: vendor-sync

# Daily upstream mirror + conflict/overlap detection. Never merges into main
# automatically: it refreshes a PR (clean case) or files a conflict issue.

on:
  schedule:
    # UTC 18:30 daily = Beijing 02:30 next day
    - cron: '30 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/stablyai/orca.git

concurrency:
  group: vendor-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        env:
          # GITHUB_TOKEN cannot push refs that contain .github/workflows/
          # changes; the mirror branches carry the whole upstream tree, so
          # pushes need a PAT (fine-grained: Contents + Workflows write).
          VENDOR_SYNC_TOKEN: ${{ secrets.VENDOR_SYNC_TOKEN }}
        run: |
          git config user.name "vendor-sync[bot]"
          git config user.email "vendor-sync[bot]@users.noreply.github.com"
          if [ -z "$VENDOR_SYNC_TOKEN" ]; then
            echo "::error::secret VENDOR_SYNC_TOKEN is missing (Settings → Secrets → Actions)"
            exit 1
          fi
          # checkout@v4 persists GITHUB_TOKEN as an Authorization extraheader
          # that overrides URL-embedded credentials; unset it so pushes use PAT.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${VENDOR_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Mirror upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune
          LATEST_STABLE=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -vE 'rc|alpha|beta' | head -1)
          # Local refs the report script diffs against...
          git branch -f vendor/upstream upstream/main
          git branch -f vendor/stable "$LATEST_STABLE"
          # ...then pure mirrors on the remote: forced, never carry custom work.
          git push origin vendor/upstream vendor/stable --force
          echo "LATEST_STABLE=$LATEST_STABLE" >> "$GITHUB_ENV"

      - name: Ensure vendor-conflict label exists
        run: |
          gh api "repos/$GITHUB_REPOSITORY/labels/vendor-conflict" >/dev/null 2>&1 \
          || gh api -X POST "repos/$GITHUB_REPOSITORY/labels" \
               -f name=vendor-conflict -f color=B45252 \
               -f description="Upstream absorb conflicts reported by vendor-sync" \
               --jq '.name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect conflicts and overlap
        id: report
        run: bash scripts/vendor/sync-report.sh

      - name: Refresh absorb pull request (clean case)
        if: steps.report.outputs.has_conflicts == 'false'
        run: |
          close_stale_conflicts() {
            local issues
            issues=$(gh api \
              "repos/$GITHUB_REPOSITORY/issues?state=open&labels=vendor-conflict" \
              --jq '.[] | select(.pull_request | not) | .number')
            if [ -n "$issues" ]; then
              echo "$issues" | xargs -r gh issue close -c \
                "merge with vendor/upstream is clean in the latest report"
            fi
          }
          # FORK: absorb branches carry upstream's .github/workflows changes;
          # GITHUB_TOKEN is barred from PR writes on such branches (and its
          # PRs would not trigger CI), so PR operations use the PAT via REST
          # (fine-grained PATs surface clearer errors on REST than GraphQL).
          GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api user --jq '"PAT identity: " + .login'
          GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api "repos/$GITHUB_REPOSITORY" \
            --jq '"PAT repo perms: " + (.permissions | tostring)'
          # Upstream fully contained in main: nothing to absorb.
          if git merge-base --is-ancestor vendor/upstream main; then
            echo "upstream already fully absorbed"
            close_stale_conflicts
            PR=$(GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:vendor/sync-latest" \
              --jq '.[0].number // empty')
            [ -n "$PR" ] && GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR" -f state=closed --jq '.state'
            exit 0
          fi
          git checkout -B vendor/sync-latest main
          git merge --no-edit vendor/upstream
          git push origin vendor/sync-latest --force
          PR=$(GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:vendor/sync-latest" \
            --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR" -F body=@.vendor-report.md --jq '.number'
          else
            GH_TOKEN="$VENDOR_SYNC_TOKEN" gh api -X POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="vendor: absorb upstream through ${LATEST_STABLE}" \
              -f head=vendor/sync-latest -f base=main \
              -F body=@.vendor-report.md --jq '"created PR #" + (.number|tostring)'
          fi
          close_stale_conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VENDOR_SYNC_TOKEN: ${{ secrets.VENDOR_SYNC_TOKEN }}

      - name: Raise conflict issue
        if: steps.report.outputs.has_conflicts == 'true'
        run: |
          TITLE="vendor: conflicts with upstream $(git rev-parse --short vendor/upstream)"
          JSON=$(jq -n --arg t "$TITLE" --rawfile body .vendor-report.md \
            '{title:$t, body:$body}')
          # Query string in the URL: -F would silently switch gh api to POST.
          # /issues includes PRs; keep only real issues.
          ISSUE=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=30" \
            --jq '[.[] | select(.pull_request | not)
                   | select(.title | startswith("vendor: conflicts"))
                   | .number][0] // empty')
          if [ -n "$ISSUE" ]; then
            URL=$(printf '%s' "$JSON" | gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --input - --jq '.html_url')
          else
            URL=$(printf '%s' "$JSON" | gh api -X POST \
              "repos/$GITHUB_REPOSITORY/issues" --input - --jq '.html_url')
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${URL##*/}/labels" \
            -f labels[]=vendor-conflict --jq '[.[].name] | join(",")'
          echo "conflict issue: $URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-report
          path: .vendor-report.md
          include-hidden-files: true
          retention-days: 30
